<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Blue Dimension reference visual matrix</title>
<desc id="d">Audiovisual reference matrix combining a neon tunnel, Zürich skyline, vinyl signal, waveform path, DJ silhouette and perspective grid.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02040b"/><stop offset=".52" stop-color="#08142c"/><stop offset="1" stop-color="#02040b"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#48b9ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <filter id="glowC"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowP"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8" stroke="#8ab4ff" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#scan)"/>

<!-- perspective grid / cyber rail -->
<g stroke="#22d3ee" stroke-opacity=".28" fill="none">
  <path d="M0 620H1600M0 680H1600M0 740H1600M0 800H1600M0 860H1600"/>
  <path d="M800 520L0 900M800 520L220 900M800 520L420 900M800 520L600 900M800 520L700 900M800 520L900 900M800 520L1000 900M800 520L1180 900M800 520L1380 900M800 520L1600 900"/>
</g>

<!-- neon tunnel -->
<g fill="none" stroke="url(#cyan)" stroke-opacity=".55">
  <ellipse cx="800" cy="485" rx="700" ry="390"/>
  <ellipse cx="800" cy="485" rx="570" ry="315"/>
  <ellipse cx="800" cy="485" rx="450" ry="250"/>
  <ellipse cx="800" cy="485" rx="335" ry="188"/>
  <ellipse cx="800" cy="485" rx="235" ry="132"/>
  <ellipse cx="800" cy="485" rx="145" ry="82"/>
</g>
<g fill="none" stroke="url(#pink)" stroke-opacity=".45">
  <path d="M110 70Q800 330 1490 70M40 180Q800 390 1560 180M20 300Q800 455 1580 300"/>
</g>

<!-- skyline -->
<g transform="translate(0 430)" stroke="#22d3ee" stroke-width="4" fill="#071326" filter="url(#glowC)">
  <path d="M120 180V95h70v85h24V52h82v128h32V78h70v102h28V20h92v160h35V86h76v94h35V40h88v140h30V5h84v175h32V72h92v108h31V38h76v142h40V88h88v92h38V50h68v130h55v-60h64v60h36V105h72v75H120z"/>
  <path d="M790 0v180M770 28h40M778 55h24M786 84h8" stroke="#ec4899"/>
</g>

<!-- waveform / signal path -->
<path d="M0 770 C80 735 130 805 205 760 S330 715 400 770 S520 830 610 755 S740 670 820 750 S940 830 1030 760 S1160 705 1240 770 S1380 825 1600 740" fill="none" stroke="url(#wave)" stroke-width="12" filter="url(#glowP)"/>
<path d="M0 770 C80 735 130 805 205 760 S330 715 400 770 S520 830 610 755 S740 670 820 750 S940 830 1030 760 S1160 705 1240 770 S1380 825 1600 740" fill="none" stroke="#dffbff" stroke-opacity=".45" stroke-width="2"/>

<!-- vinyl / signal disc -->
<g transform="translate(180 185)" filter="url(#glowC)">
  <circle r="108" fill="#06102a" stroke="#22d3ee" stroke-width="5"/>
  <circle r="82" fill="none" stroke="#168cff" stroke-opacity=".65" stroke-width="2"/>
  <circle r="54" fill="none" stroke="#ec4899" stroke-opacity=".7" stroke-width="3"/>
  <circle r="10" fill="#f6c453"/>
  <path d="M-98 0H-112M98 0H112M0-98V-112M0 98V112" stroke="#22d3ee" stroke-width="4"/>
</g>

<!-- DJ / SYS.USR silhouette -->
<g transform="translate(1180 115)" stroke="#22d3ee" stroke-width="6" fill="none" filter="url(#glowC)">
  <circle cx="0" cy="0" r="62"/>
  <path d="M-42-20Q0-78 42-20M-42-20Q-55 5-46 28M42-20Q55 5 46 28"/>
  <path d="M-95 170Q-88 90 0 76Q88 90 95 170"/>
  <path d="M-70 170V115M70 170V115M0 78V170"/>
  <path d="M-55 138L-18 115M55 138L18 115"/>
</g>

<!-- train / express motif -->
<g transform="translate(790 590)" fill="none" stroke="#ec4899" stroke-width="5" opacity=".75" filter="url(#glowP)">
  <path d="M-300 120L-240 10H100L230 80L330 120"/>
  <circle cx="-190" cy="125" r="30"/><circle cx="30" cy="125" r="30"/><circle cx="220" cy="125" r="30"/>
  <path d="M-230 30V-65H-90V30M-60 30V-95H90V30M120 50V-40H215V65"/>
  <path d="M-210-65h110M-35-95h110"/>
</g>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="4">
  <text x="64" y="70" fill="#22d3ee" font-size="22">BLUE DIMENSION // REFERENCE VISUAL MATRIX</text>
  <text x="64" y="104" fill="#8293a8" font-size="15">ZÜRICH · SIGNAL 97.5 MHz · EST. 1997</text>
  <text x="1280" y="850" fill="#f6c453" font-size="15">J•Ր / IDENTITY ACCENT</text>
</g>
</svg>