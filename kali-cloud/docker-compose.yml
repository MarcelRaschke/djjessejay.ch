version: "3.9"

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  ULTIMATE HACKER – Docker Compose                                           ║
# ║  Stack: Kali Linux · HexStrike AI · Claude Code (Opus 4.6) · OpenClaw     ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Verwendung:
#   export ANTHROPIC_API_KEY=sk-ant-...
#   docker compose up -d
#   docker compose exec kali claude     ← Opus 4.6 + HexStrike AI MCP

services:
  kali:
    image: kalilinux/kali-rolling:latest
    container_name: kali-cloud
    hostname: kali-cloud
    restart: unless-stopped
    stdin_open: true
    tty: true
    privileged: false
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PULSE_SERVER=unix:/run/pulse/native
      # Anthropic API Key – für Claude Code (Opus 4.6)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Claude Code: Modell festlegen (Host-Env überschreibt den Default)
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-6}
      # Mistral API Key – für Codestral-Provider
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Pro-Operatives Provider:Model-Specs (leer = fällt auf ANTHROPIC_MODEL zurück)
      # Beispiel: EXPLOIT_SPEC=mistral:codestral-latest docker compose up
      - RECON_SPEC=${RECON_SPEC:-}
      - ENUM_SPEC=${ENUM_SPEC:-}
      - EXPLOIT_SPEC=${EXPLOIT_SPEC:-}
      - WEB_SPEC=${WEB_SPEC:-}
      - AD_SPEC=${AD_SPEC:-}
      - CTF_SPEC=${CTF_SPEC:-}
      - REPORT_SPEC=${REPORT_SPEC:-}
    volumes:
      - ./setup.sh:/opt/setup.sh:ro
      - kali-home:/root
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Claude Code Konfig persistent
      - claude-config:/root/.claude
    ports:
      - "2222:22"      # SSH
      - "13145:13145"  # HexStrike AI API
    networks:
      - kali-net
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq openssh-server &&
        service ssh start &&
        bash /opt/setup.sh &&
        tail -f /dev/null
      "

  # VNC-Server für Remote-Desktop-Zugriff
  novnc:
    image: theasp/novnc:latest
    container_name: kali-novnc
    restart: unless-stopped
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - DISPLAY=${DISPLAY:-:0}
    ports:
      - "8080:8080"  # noVNC Web-Interface
    networks:
      - kali-net
    depends_on:
      - kali

volumes:
  kali-home:
  claude-config:

networks:
  kali-net:
    driver: bridge
