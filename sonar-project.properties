# SonarQube-Scannerkonfiguration fuer djjessejay.ch
#
# Der Scanner liest diese Datei automatisch aus dem Projektstammverzeichnis.
# Deshalb steht der Projektschluessel hier und nicht mehr als leeres
# -Dsonar.projectKey= im Workflow, wo er seit dc6900c0 (2026-11-12) stand.
#
# sonar.projectKey muss mit dem Schluessel des Projekts in der SonarQube-
# Instanz uebereinstimmen, auf die SONAR_HOST_URL zeigt. Der Wert unten folgt
# der Konvention <Owner>_<Repo>. Heisst das Projekt dort anders, ist dieser
# Wert anzupassen.
sonar.projectKey=MarcelRaschke_djjessejay.ch
sonar.projectName=djjessejay.ch
sonar.sourceEncoding=UTF-8

# Alles ist Quellcode ausser dem unten Ausgeschlossenen. Bewusst keine
# Positivliste von Verzeichnissen: das Repository hat ueber zwanzig
# Top-Level-Verzeichnisse mit Code, und eine Positivliste laesst ein neu
# hinzugekommenes stillschweigend ungeprueft.
sonar.sources=.

# Quell- und Testmenge muessen disjunkt sein, sonst bricht der Scanner mit
# "File <name> can't be indexed twice" ab. Die Testpfade stehen deshalb
# zusaetzlich in sonar.exclusions: dort werden sie aus der Quellmenge
# genommen, hier als Testmenge deklariert.
sonar.tests=test,tests

# vendor/     Fremdcode (Three.js, 16 Dateien, davon three.module.js mit 1.2 MB)
# tailwind.css  Build-Ausgabe von "npm run build:css", minifiziert
sonar.exclusions=\
  vendor/**,\
  test/**,\
  tests/**,\
  node_modules/**,\
  tailwind.css,\
  **/*.min.js,\
  **/*.min.css
