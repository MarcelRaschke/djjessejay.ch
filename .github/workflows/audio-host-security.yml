name: Audio Host Security Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attestation-contract:
    name: Audio host attestation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node.js (pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify host-attestation contract tests
        run: node --test test/audio-host-attestation-verify.test.mjs
      - name: Verify independent signed host attestation (fail closed)
        env:
          AUDIO_HOST_ATTESTATION_B64: ${{ secrets.AUDIO_HOST_ATTESTATION_B64 }}
          AUDIO_HOST_ROOT_PUB_B64: ${{ secrets.AUDIO_HOST_ROOT_PUB_B64 }}
          AUDIO_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: AUDIO_EXPECTED_SHA="$AUDIO_EXPECTED_SHA" node scripts/audio-host-attestation-verify.mjs

  dependency-and-runtime:
    name: Audio dependency and runtime security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python (pinned)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Require complete hashed dependency lock (fail closed)
        run: |
          test -s audio-intelligence-moe/requirements.lock
          grep -q -- '--hash=sha256:' audio-intelligence-moe/requirements.lock
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r audio-intelligence-moe/requirements.lock
      - name: Run Audio Intelligence security and MCP tests
        run: cd audio-intelligence-moe && python -m unittest discover -s tests -v
