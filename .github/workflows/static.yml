# Build & Deploy to GitHub Pages
# Rerun triggered 2026-08-08 to test runner availability after 11h+ queue timeout
name: Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS with Tailwind
        run: npm run build:css

      - name: Inject Turnstile site key
        if: ${{ vars.TURNSTILE_SITE_KEY != '' }}
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build:html

      - name: Remove large/unnecessary files before upload
        run: |
          # Remove database dumps (SQL/XML archives)
          rm -f *.sql *.xml
          # Remove video files (large legacy assets)
          rm -f *.mov *.mp4 *.webm
          # Remove Flash files (non-functional)
          rm -f *.swf
          # Remove old HTML versions (not needed for deploy)
          rm -f home.html home.htm
          # Remove web scraper utility (not site content)
          rm -rf web_scraper
          # Remove markdown docs and license (not served, just metadata)
          rm -f *.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE
          # Remove legacy files
          rm -f michi.swf get_flashplayer_88_31.gif
          # Remove node_modules (not needed for static deployment)
          rm -rf node_modules

      - name: Upload artifact
        # Do not go back to v3. This repository requires every action to be
        # pinned to a full-length commit SHA, and that rule is also applied to
        # the nested references inside a composite action. v3
        # (56afc609e74202658d3ffba0e8f6dda462b719fa) calls
        # `actions/upload-artifact@v4` unpinned, which cannot be pinned from
        # here, so every deploy aborted in "Prepare all required actions":
        #
        #   The action actions/upload-artifact@v4 is not allowed in
        #   MarcelRaschke/djjessejay.ch because all actions must be pinned to a
        #   full-length commit SHA.
        #
        # v4.0.0 pins it to actions/upload-artifact@ea165f8d (v4.6.2) — same
        # artifact major as before, so behaviour is unchanged; only the
        # reference became pinnable. Inputs are identical.
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          # Upload minimal, optimized site directory
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
