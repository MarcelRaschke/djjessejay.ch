# Build & Deploy to GitHub Pages
# Rerun triggered 2026-08-08 to test runner availability after 11h+ queue timeout
name: Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      bdsn_sha:
        description: "BDSN release SHA that bdsn-sync requested (labels the run for its retry cooldown)"
        required: false
        default: ""

# Dispatches from bdsn-sync carry the requested release in the run name, so a
# failure can be tied to that release. Other runs keep the default name.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.bdsn_sha != '' && format('BDSN {0}', inputs.bdsn_sha) || '' }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # secrets.* is not allowed in if:, presence is evaluated once here.
      HAS_CF_PURGE: ${{ secrets.CF_CACHE_PURGE_TOKEN != '' && vars.CLOUDFLARE_ZONE_ID != '' }}
      BDSN_REPO: MarcelRaschke/Blue-Dimension-
      BDSN_TAG: bdsn-live
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS with Tailwind
        run: npm run build:css

      - name: Inject Turnstile site key
        if: ${{ vars.TURNSTILE_SITE_KEY != '' }}
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build:html

      - name: Validate public provenance bundle
        run: python3 scripts/package-provenance-v9.py --site-check

      - name: Stage public site allowlist
        # Copies only lib/public-site.js entries into _site. Server code, package
        # manifests, docs, tests and dotfiles are never part of the Pages artifact.
        run: node scripts/stage-pages-site.mjs _site

      # Blue Dimension under /BDSN/. Source of truth is the tag bdsn-live in
      # Blue-Dimension-, set by its "Release BDSN" workflow after all checks.
      # No token: public repo, read-only checkout. The checker used here is
      # this repo's own copy, no code from the other repo is executed.
      - name: Resolve BDSN release
        id: bdsn
        run: |
          set -euo pipefail
          sha="$(git ls-remote "https://github.com/${BDSN_REPO}.git" "refs/tags/${BDSN_TAG}^{}" | cut -f1)"
          [ -n "$sha" ] || sha="$(git ls-remote "https://github.com/${BDSN_REPO}.git" "refs/tags/${BDSN_TAG}" | cut -f1)"
          if [ -z "$sha" ]; then
            echo "::notice::${BDSN_TAG} existiert noch nicht; /BDSN/ wird nicht veröffentlicht."
            echo "staged=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ungültige SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Checkout Blue Dimension (bdsn-live)
        if: steps.bdsn.outputs.staged == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BDSN_REPO }}
          ref: ${{ steps.bdsn.outputs.sha }}
          path: .bdsn-src
          persist-credentials: false
          sparse-checkout: public
          sparse-checkout-cone-mode: true

      - name: Verify and stage /BDSN/
        if: steps.bdsn.outputs.staged == 'true'
        env:
          BDSN_SHA: ${{ steps.bdsn.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-site.py .bdsn-src/public --allow-prefix /media/gallery/
          rm -rf _site/BDSN
          cp -r .bdsn-src/public _site/BDSN
          printf '%s\n' "$BDSN_SHA" > _site/BDSN/bdsn-version.txt
          rm -rf .bdsn-src
          echo "BDSN ${BDSN_SHA} unter /BDSN/ bereitgestellt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Purge Cloudflare cache
        if: env.HAS_CF_PURGE == 'true'
        env:
          CF_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          resp="$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"
          echo "$resp" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' \
            || echo "::warning::Cloudflare-Purge fehlgeschlagen"

      - name: Verify /BDSN/ live
        if: steps.bdsn.outputs.staged == 'true'
        env:
          BDSN_SHA: ${{ steps.bdsn.outputs.sha }}
        run: |
          set -euo pipefail
          # Probe the URLs visitors request, without a query string, so the answer
          # comes through the Worker cache (infra/cloudflare/wdjjj.js caches only
          # query-free GETs; HTML for s-maxage=600). Without a successful purge the
          # old release can be served for up to 10 min, hence the 13 min window.
          [ -f _site/BDSN/index.html ] || { echo "::error::_site/BDSN/index.html fehlt"; exit 1; }
          want_html="$(sha256sum _site/BDSN/index.html | cut -d' ' -f1)"
          for i in $(seq 1 78); do
            live="$(curl -fsS https://djjessejay.ch/BDSN/bdsn-version.txt 2>/dev/null | tr -d '[:space:]' || true)"
            html="$( (curl -fsS https://djjessejay.ch/BDSN/ 2>/dev/null || true) | sha256sum | cut -d' ' -f1)"
            if [ "$live" = "$BDSN_SHA" ] && [ "$html" = "$want_html" ]; then
              echo "BDSN live: $BDSN_SHA (HTML identisch mit Build)"; exit 0
            fi
            sleep 10
          done
          echo "::error::/BDSN/ liefert nach 13 min nicht ${BDSN_SHA} mit dem gebauten HTML (Version live: ${live:-none}, HTML gleich: $([ "$html" = "$want_html" ] && echo ja || echo nein))"
          exit 1
