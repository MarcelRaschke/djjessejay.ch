# Build & Deploy to GitHub Pages
name: Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS with Tailwind
        run: npm run build:css

      - name: Inject reCAPTCHA site key
        if: ${{ vars.RECAPTCHA_SITE_KEY != '' }}
        env:
          RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: npm run build:html

      # Allowlist bundle: only files that are part of the public site are
      # deployed. Replaces the previous root-level rm blacklist, which left
      # docs/, scripts/, infra/, honeypot/, policy/, server.js, .env.example
      # and more publicly reachable on Pages. When adding new public assets,
      # extend the lists below (this failure mode is intentional).
      - name: Assemble deploy bundle (allowlist)
        run: |
          set -euo pipefail
          mkdir -p dist/assets dist/css dist/js
          # Linked pages
          cp index.html ivdj-supreme.html index-legacy.html hero-test.html dist/
          # Base assets referenced by the pages
          cp favicon.svg favicon.ico spacer.svg img_contact_sound.svg dist/
          cp jessejay.css scripts.js tailwind.css dist/
          cp DJ-Jesse-Jay.jpg DJPult.gif dist/
          cp robots.txt .nojekyll dist/
          # Asset directories (referenced by index-legacy / hero-test)
          cp assets/*.svg dist/assets/
          cp css/*.css dist/css/
          cp js/*.js dist/js/
          echo "Deploy bundle contents:"
          find dist -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # Purge the wdjjj edge cache for exactly the paths of this deploy, so
      # page deploys without a worker deploy no longer serve stale content for
      # up to s-maxage (600s HTML). Requires repo secret WDJJJ_PURGE_TOKEN and
      # the matching PURGE_TOKEN worker secret (wrangler secret put PURGE_TOKEN
      # --name wdjjj). Without the secret the step degrades to a warning and
      # the deploy still succeeds.
      - name: Purge worker edge cache for deployed paths
        env:
          PURGE_TOKEN: ${{ secrets.WDJJJ_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PURGE_TOKEN" ]; then
            echo "::warning::WDJJJ_PURGE_TOKEN not set - skipping edge cache purge; cache expires via s-maxage."
            exit 0
          fi
          json="$(node -e 'const fs=require("fs"),path=require("path");const out=new Set();(function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else{const clean=p.replace(/^dist/,"")||"/";out.add(clean);if(clean.endsWith("/index.html"))out.add(clean.replace(/index\.html$/,""));}}})("dist");process.stdout.write(JSON.stringify({paths:[...out]}));')"
          echo "Purge payload: $json"
          curl -fsS -X POST \
            -H "x-purge-token: $PURGE_TOKEN" \
            -H "content-type: application/json" \
            -d "$json" \
            https://djjessejay.ch/__wdjjj/purge
