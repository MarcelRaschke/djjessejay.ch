# Build & Deploy to GitHub Pages
name: Build & Deploy

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS with Tailwind
        run: npm run build:css

      - name: Remove large/unnecessary files before upload
        run: |
          # Remove database dumps (SQL/XML archives)
          rm -f *.sql *.xml
          # Remove video files (large legacy assets)
          rm -f *.mov *.mp4 *.webm
          # Remove Flash files (non-functional)
          rm -f *.swf
          # Remove old HTML versions (not needed for deploy)
          rm -f home.html home.htm
          # Remove web scraper utility (not site content)
          rm -rf web_scraper
          # Remove markdown docs and license (not served, just metadata)
          rm -f *.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE
          # Remove legacy files
          rm -f michi.swf get_flashplayer_88_31.gif
          # Remove node_modules (not needed for static deployment)
          rm -rf node_modules

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload minimal, optimized site directory
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
