name: Secret Management

# Lifecycle for all Actions secrets of this repository:
#   static-audit   every PR/push: references vs .github/secrets-inventory.json
#   (leak scanning: gitleaks in security-gate.yml)
#   remote-audit   weekly: presence, unmanaged/forbidden secrets, rotation age
#
# Secret values are only ever passed through env:, never interpolated into run:.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/secrets-inventory.json"
      - "scripts/secrets-*"
      - "scripts/check-env-examples.py"
      - ".env*"
  push:
    branches: [main]
  schedule:
    # Mondays 05:17 UTC, off the full hour
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-audit:
    name: Static secrets audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inventory JSON
        run: python3 -m json.tool .github/secrets-inventory.json > /dev/null

      - name: Audit workflow references
        run: python3 scripts/secrets-audit.py static

      - name: Tracked env files must be examples
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Echte .env-Dateien im Repository:"; echo "$bad"; exit 1
          fi
          # Example files must not carry real-looking values. Only the assigned value
          # is judged (inline comments removed), and only whole-value placeholders are
          # exempt; see scripts/check-env-examples.py.
          files="$(git ls-files | grep -E '\.env\.(example|dev)$' || true)"
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            python3 scripts/check-env-examples.py $files
          fi

  remote-audit:
    name: Remote audit (presence and rotation age)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      HAS_AUDIT_TOKEN: ${{ secrets.SECRETS_AUDIT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip notice
        if: env.HAS_AUDIT_TOKEN != 'true'
        run: echo "::warning::SECRETS_AUDIT_TOKEN fehlt; Remote-Audit übersprungen (siehe docs/SECRET-MANAGEMENT.md)."

      - name: Fetch secret metadata (names and timestamps only)
        if: env.HAS_AUDIT_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/remote"; mkdir -p "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/secrets" --paginate > "$out/repo.json"
          # A failed environment listing must fail the job: remote_audit() skips scopes
          # that were not fetched, so an empty list would pass silently.
          gh api "repos/$GITHUB_REPOSITORY/environments" --paginate --jq '.environments[].name' > "$out/envs.txt"
          while IFS= read -r env_name; do
            [ -n "$env_name" ] || continue
            case "$env_name" in *[!A-Za-z0-9._-]*) echo "::warning::Environment-Name übersprungen"; continue ;; esac
            gh api "repos/$GITHUB_REPOSITORY/environments/$env_name/secrets" --paginate > "$out/env-$env_name.json"
          done < "$out/envs.txt"

      - name: Audit
        id: audit
        if: env.HAS_AUDIT_TOKEN == 'true'
        run: |
          set +e
          python3 scripts/secrets-audit.py remote --remote-dir "$RUNNER_TEMP/remote" \
            --json-out "$RUNNER_TEMP/findings.json" > "$RUNNER_TEMP/report.md"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md"
          exit 0

      - name: Sync tracking issue
        if: env.HAS_AUDIT_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.audit.outputs.rc }}
        run: |
          set -euo pipefail
          label="secrets-audit"
          gh label create "$label" --color B60205 --description "Secret-Rotation und Inventar" --force >/dev/null
          num="$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')"
          body="$RUNNER_TEMP/report.md"
          printf '\n\nLauf: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$body"
          if [ "$RC" != "0" ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file "$body"
              gh issue comment "$num" --body "Audit weiterhin mit Befunden: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            else
              gh issue create --title "Secrets-Audit: Handlungsbedarf" --label "$label" --body-file "$body"
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Audit ohne Fehler. Schliesse automatisch."
          fi

      - name: Fail on findings
        if: env.HAS_AUDIT_TOKEN == 'true' && steps.audit.outputs.rc != '0'
        run: exit 1
