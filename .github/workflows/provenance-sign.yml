name: Provenance sign

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attest (e.g. v7.0.0)'
        required: true
        default: 'v7.0.0'

permissions:
  contents: write

concurrency:
  group: provenance-sign-${{ inputs.tag }}

jobs:
  attest-release:
    name: Create Sigstore attestation for ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release tag object
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/sign-release-attestation.sh

      - name: Commit attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "provenance/attestations/${TAG}.sigstore.json" "provenance/attestations/${TAG}.identity"
          git commit -m "security: archive ${TAG} Sigstore attestation [provenance-finalize]"
          git push
