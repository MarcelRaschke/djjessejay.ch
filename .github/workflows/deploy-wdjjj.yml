name: Deploy wdjjj

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-wdjjj.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Cloudflare account ID is an identifier, not a credential (it already appears
  # in public Cloudflare bot comments on PRs). A CLOUDFLARE_ACCOUNT_ID repo secret,
  # if set, takes precedence.
  CLOUDFLARE_ACCOUNT_ID_PUBLIC: "2b0ff70ea2347c1e25d4c32c661d6356"

concurrency:
  group: deploy-wdjjj
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

      - name: Verify deployment credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for this workflow context"
            exit 1
          }
          test -n "$CF_ACCOUNT_ID" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured for this workflow context"
            exit 1
          }
          echo "Cloudflare deployment credentials are configured."

      # The deployed Worker fails closed on /api when the Access service-token
      # secrets are not bound (ORIGIN-PROTECTION-DEPLOYMENT.md, "Worker-only
      # origin"). Deploying before they exist would take /api down, so the
      # binding is checked BEFORE the upload, not after. Secret values are never
      # returned by this endpoint; it lists names only.
      - name: Verify Access service-token secrets are bound
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
        run: |
          set -euo pipefail
          response="$(curl -sS -o /tmp/wdjjj-secrets.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/wdjjj/secrets")"
          if [ "$response" = "404" ]; then
            echo "::warning::Worker wdjjj does not exist yet; skipping secret binding check for the first deploy."
            exit 0
          fi
          if [ "$response" != "200" ]; then
            echo "::error::Cannot read Worker secret bindings (HTTP $response). Token needs Workers Scripts:Read."
            exit 1
          fi
          for name in ORIGIN_ACCESS_CLIENT_ID ORIGIN_ACCESS_CLIENT_SECRET; do
            node -e '
              const fs = require("node:fs");
              const name = process.argv[1];
              const body = JSON.parse(fs.readFileSync("/tmp/wdjjj-secrets.json", "utf8"));
              const names = (body.result || []).map((entry) => entry.name);
              if (!names.includes(name)) {
                console.error(`::error::Worker secret ${name} is not bound. Run: npx wrangler secret put ${name}`);
                process.exit(1);
              }
            ' "$name"
          done
          rm -f /tmp/wdjjj-secrets.json
          echo "Access service-token secrets are bound."

      # NOTE: run 38246122897 (2026-10-12) uploaded the Worker but failed at
      # trigger configuration: "A request to the Cloudflare API
      # (/accounts/<id>/workers/scripts/wdjjj/routes) failed. No access to the
      # specified resource." The Worker then has no bound routes and djjessejay.ch
      # stays on the DNS fallback origin (HTTP 522). CLOUDFLARE_API_TOKEN needs
      # Account permissions "Workers Scripts:Edit" AND "Workers Routes:Edit"
      # (plus "Account Settings:Read"); a token with only script-edit uploads
      # the code but cannot bind routes. See scripts/deployment-checklist.sh and
      # DNS_CONFIG.md for the expected end state.
      - name: Deploy wdjjj
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          wranglerVersion: "4.145.0"
          workingDirectory: infra/cloudflare
          command: deploy

      - name: Verify Worker health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -A "wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)" https://djjessejay.ch/__wdjjj/health)" && {
              echo "$body"
              echo "$body" | grep -q '"ok":true'
              echo "$body" | grep -q '"proxy":"wdjjj"'
              # Access service token must be bound at the live edge, or /api is
              # fail-closed 502. The value itself is never exposed here.
              echo "$body" | grep -q '"originAuth":"configured"'
              exit 0
            }
            sleep 10
          done
          echo "Cloudflare Worker health check failed" >&2
          exit 1

      - name: Verify apex
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -L --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' https://djjessejay.ch/)"
          echo "Apex HTTP status: $code"
          test "$code" = "200"

      - name: Verify security headers
        run: |
          set -euo pipefail
          headers="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -D - -o /dev/null https://djjessejay.ch/)"
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^referrer-policy:'

      - name: Verify POST rejection
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' -X POST https://djjessejay.ch/)"
          echo "POST HTTP status: $code"
          test "$code" = "405"
