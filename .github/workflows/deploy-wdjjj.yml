name: Deploy wdjjj

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-wdjjj.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Cloudflare account ID is an identifier, not a credential (it already appears
  # in public Cloudflare bot comments on PRs). A CLOUDFLARE_ACCOUNT_ID repo secret,
  # if set, takes precedence.
  CLOUDFLARE_ACCOUNT_ID_PUBLIC: "2b0ff70ea2347c1e25d4c32c661d6356"

concurrency:
  group: deploy-wdjjj
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

      - name: Verify deployment credentials are configured
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for this workflow context"
            exit 1
          }
          test -n "$CF_ACCOUNT_ID" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured for this workflow context"
            exit 1
          }
          echo "Cloudflare deployment credentials are configured."

      - name: Deploy wdjjj
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          wranglerVersion: "4.145.0"
          workingDirectory: infra/cloudflare
          command: deploy

      - name: Verify Worker health
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -A "wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)" https://djjessejay.ch/__wdjjj/health)" && {
              echo "$body"
              echo "$body" | grep -q '"ok":true'
              echo "$body" | grep -q '"proxy":"wdjjj"'
              exit 0
            }
            sleep 10
          done
          echo "Cloudflare Worker health check failed" >&2
          exit 1

      - name: Verify authenticated API path
        # /api/* goes Worker -> Access service token -> origin. A mistyped, rotated, disabled or
        # non-admitted token still passes [secrets].required, so exercise the real path.
        run: |
          set -euo pipefail
          ua="wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)"
          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            code="$(curl -sS -A "$ua" -D "$headers" -o api-health.json -w '%{http_code}' https://djjessejay.ch/api/health || true)"
            echo "API health HTTP status: $code"
            # A 429 from the backend's own rate limiter (RateLimit-Policy header) also proves that
            # the Worker -> Access -> tunnel -> Express path works; only its quota is exhausted.
            if [ "$code" = "429" ] && grep -qi '^ratelimit-policy:' "$headers"; then
              echo "Backend rate limit reached; authenticated path verified via the Express 429"
              code=200; echo '{"status":"healthy"}' > api-health.json
            fi
            if [ "$code" = "200" ] && grep -q '"status":"healthy"' api-health.json; then
              if grep -qi '^set-cookie: *CF_' "$headers"; then
                echo "Access session cookie leaked to the client" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Authenticated API path failed: check ORIGIN_ACCESS_CLIENT_ID/SECRET, the Access policy and the tunnel" >&2
          exit 1

      - name: Verify origin rejects requests without the service token
        # Only an Access denial counts. Express sets RateLimit-Policy on every /api response
        # (express-rate-limit standardHeaders), so that header means the backend was reached.
        # Access answers non-browser clients with a redirect to its login (302/303/307),
        # or 401 (managed OAuth) / 403.
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          if ! code="$(curl -sS -A "wdjjj-healthcheck/1.0" -D "$headers" -o /dev/null -w '%{http_code}' --max-redirs 0 https://origin.djjessejay.ch/api/health)"; then
            echo "origin.djjessejay.ch could not be reached; the probe proves nothing" >&2
            exit 1
          fi
          echo "Direct origin HTTP status without token: $code"
          if grep -qi '^ratelimit-policy:' "$headers"; then
            echo "The backend answered without the Access service token: origin is publicly reachable" >&2
            exit 1
          fi
          case "$code" in
            302|303|307)
              if grep -qiE '^location: *[^ ]*(/cdn-cgi/access/|cloudflareaccess\.com)' "$headers"; then exit 0; fi
              echo "Redirect does not point to Cloudflare Access" >&2; exit 1 ;;
            401|403) exit 0 ;;
            *) echo "Unexpected status $code: not an Access denial" >&2; exit 1 ;;
          esac

      - name: Verify apex
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -L --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' https://djjessejay.ch/)"
          echo "Apex HTTP status: $code"
          test "$code" = "200"

      - name: Verify security headers
        run: |
          set -euo pipefail
          headers="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -D - -o /dev/null https://djjessejay.ch/)"
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^referrer-policy:'

      - name: Verify POST rejection
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' -X POST https://djjessejay.ch/)"
          echo "POST HTTP status: $code"
          test "$code" = "405"
