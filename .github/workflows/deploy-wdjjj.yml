# wdjjj — Verifikation der Live-Lage, und ein Deploy-Pfad auf Anforderung.
#
# Dieser Workflow deployt auf Push nicht mehr. Der reguläre Deploy soll bei
# Cloudflare über Workers Builds laufen: die GitHub-App "Cloudflare Workers and
# Pages" ist auf dem Repository installiert, Cloudflare deployt bei jedem Push
# auf main selbst. Dann liegt kein Cloudflare-Credential in GitHub, das ablaufen
# kann — die Vertrauensrichtung ist umgedreht, Cloudflare hält eine
# GitHub-Verbindung statt GitHub ein Cloudflare-Geheimnis.
#
# NOCH NICHT WIRKSAM. Workers Builds für wdjjj existiert, scheitert aber seit
# 2026-10-13 an seinem Build-Kommando. Bis die drei Felder unten einmal im
# Dashboard korrigiert sind, deployt den Worker nichts automatisch — weder
# dieser Workflow noch Workers Builds. Bis dahin bleibt der Notfallpfad
# (deploy_with_token=true) der einzige Weg, und er braucht ein gültiges Token.
#
# Warum überhaupt: ein handgemachtes API-Token mit TTL hat den Deploy vom
# 2026-10-22 bis mindestens 2026-11-05 blockiert (`tokenStatus: "expired"`),
# und das war der zweite Ausfall dieser Art. Siehe
# docs/CLOUDFLARE-DEPLOY-RECOVERY.md und DNS_CONFIG.md.
#
# Was Workers Builds braucht (einmalig im Dashboard, Workers & Pages > wdjjj >
# Settings > Build):
#   Root directory   infra/cloudflare
#   Build command    (leer)
#   Deploy command   npx wrangler deploy
# Das Deploy-Kommando ruft Wrangler, also bleibt infra/cloudflare/wrangler.toml
# die Quelle der Konfiguration; die Dashboard-Einstellung liefert nur den
# Auslöser. Vor dieser Korrektur stand dort `gobuild`, ein Kommando, das nicht
# existiert, weshalb jeder Lauf seit 2026-10-13 abbrach.
#
# Grenze dieses Workflows, ausdrücklich: der `verify`-Job prüft die LIVE-Lage,
# er sperrt keinen Deploy ab. Bei einem Push laufen Workers Builds und dieser
# Workflow nebeneinander, die Assertions können also noch den vorherigen Worker
# treffen. Der Dauerzustand wird vom täglichen Live Site Smoke geprüft.

name: Deploy wdjjj

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-wdjjj.yml"
      - "scripts/cloudflare-deploy-preflight.mjs"
      - "test/cloudflare-deploy-preflight.test.mjs"
  workflow_dispatch:
    inputs:
      deploy_with_token:
        description: 'Zusätzlich über das CLOUDFLARE_API_TOKEN deployen (Notfallpfad; regulär deployt Workers Builds)'
        type: boolean
        default: false
      diagnose_only:
        description: 'Nur Cloudflare-Authentisierung und Worker-Lesezugriff prüfen, nicht deployen'
        type: boolean
        default: false
      token_kind:
        description: 'Art des Cloudflare-API-Tokens (auto prüft user, dann account)'
        type: choice
        options: [auto, user, account]
        default: auto

permissions:
  contents: read

env:
  # Cloudflare account ID is an identifier, not a credential (it already appears
  # in public Cloudflare bot comments on PRs). A CLOUDFLARE_ACCOUNT_ID repo secret,
  # if set, takes precedence.
  CLOUDFLARE_ACCOUNT_ID_PUBLIC: "2b0ff70ea2347c1e25d4c32c661d6356"

concurrency:
  group: deploy-wdjjj
  cancel-in-progress: false

jobs:
  # Braucht kein Credential. Deshalb kann dieser Job nicht an einem abgelaufenen
  # Token scheitern, und ein rotes Ergebnis hier bedeutet wirklich, dass am Edge
  # etwas nicht stimmt.
  verify:
    name: Verify Worker syntax and live edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Test deployment preflight
        run: node --test test/cloudflare-deploy-preflight.test.mjs

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

      - name: Verify live edge
        if: inputs.diagnose_only != true
        run: ./scripts/verify-live-edge.sh

      - name: Note the deploy path
        if: always()
        run: |
          {
            echo '### Deploy-Pfad'
            echo
            echo 'Dieser Job deployt nicht. Der reguläre Deploy läuft bei Cloudflare über Workers Builds.'
            echo 'Ein grünes Ergebnis hier heisst: der Edge antwortet korrekt — nicht, dass gerade deployt wurde.'
          } >> "$GITHUB_STEP_SUMMARY"

  # Notfallpfad. Läuft nur auf ausdrückliche Anforderung, nie auf Push, damit ein
  # abgelaufenes Token nicht länger jeden Commit rot färbt.
  deploy-with-token:
    name: Deploy via CLOUDFLARE_API_TOKEN (on request)
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_with_token == true || inputs.diagnose_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # Beide Schritte liefen vor der Aufteilung in diesem Job vor dem Upload und
      # muessen das weiter tun. Sie brauchen kein Credential und keinen
      # erreichbaren Edge, haengen also NICHT am `verify`-Job — ein laufender
      # Ausfall darf eine Notfall-Wiederherstellung nicht blockieren.
      #
      # Was sie verhindern: `node --check` einen syntaktisch kaputten Upload, und
      # der Test "active Worker name still matches the checked target" einen
      # Upload unter anderem Namen. Der Preflight prueft Zugriff auf das
      # hartkodierte wdjjj; steht in wrangler.toml ein anderer `name`, deployt
      # Wrangler an einem anderen Ziel, und die Live-Assertions koennen das nicht
      # sehen. Ohne diese Schritte waere das ein Umgehen der Pruefung im Sinne
      # von AGENTS.md ("Disable or bypass CI").
      - name: Test deployment preflight
        run: node --test test/cloudflare-deploy-preflight.test.mjs

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

      - name: Verify Cloudflare token and target Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          CLOUDFLARE_TOKEN_KIND: ${{ inputs.token_kind || vars.CLOUDFLARE_TOKEN_KIND || 'auto' }}
          CF_WORKER_NAME: wdjjj
        run: node scripts/cloudflare-deploy-preflight.mjs

      - name: Record diagnostic-only completion
        if: inputs.diagnose_only == true
        run: echo 'Diagnostic-only run; no Worker upload or route change requested.' >> "$GITHUB_STEP_SUMMARY"

      # Die Berechtigungen bleiben dieselben wie bisher: Edit-Zugriff auf wdjjj
      # und Zone > Workers Routes > Edit für Routenänderungen. Der Preflight oben
      # prüft nur Tokenstatus und Lesezugriff; ein Deploy kann danach noch an
      # fehlenden Schreibrechten scheitern.
      - name: Deploy wdjjj
        if: inputs.diagnose_only != true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          wranglerVersion: "4.145.0"
          workingDirectory: infra/cloudflare
          command: deploy

      # Muss NACH dem Upload laufen, und zwar in diesem Job. Die beiden Jobs
      # sind nebenläufig, der `verify`-Job prüft also womöglich noch den
      # vorherigen Worker. Ohne diesen Schritt könnte ein Notfall-Deploy einen
      # kaputten Worker hochladen und trotzdem grün melden — das wäre ein
      # Umgehen der Prüfung im Sinne von AGENTS.md ("Disable or bypass CI").
      - name: Verify live edge after upload
        if: inputs.diagnose_only != true
        run: ./scripts/verify-live-edge.sh

      # Origin-Protection-Verifikation aus PR #160: der authentifizierte Pfad
      # muss end-to-end funktionieren, und origin.djjessejay.ch muss ohne
      # Service-Token eine Access-Verweigerung liefern.
      - name: Verify authenticated API path
        # /api/* goes Worker -> Access service token -> origin. A mistyped, rotated, disabled or
        # non-admitted token still passes [secrets].required, so exercise the real path.
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          ua="wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)"
          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            code="$(curl -sS -A "$ua" -D "$headers" -o api-health.json -w '%{http_code}' https://djjessejay.ch/api/health || true)"
            echo "API health HTTP status: $code"
            # A 429 from the backend's own rate limiter (RateLimit-Policy header) also proves that
            # the Worker -> Access -> tunnel -> Express path works; only its quota is exhausted.
            if [ "$code" = "429" ] && grep -qi '^ratelimit-policy:' "$headers"; then
              echo "Backend rate limit reached; authenticated path verified via the Express 429"
              code=200; echo '{"status":"healthy"}' > api-health.json
            fi
            if [ "$code" = "200" ] && grep -q '"status":"healthy"' api-health.json; then
              if grep -qi '^set-cookie: *CF_' "$headers"; then
                echo "Access session cookie leaked to the client" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Authenticated API path failed: check ORIGIN_ACCESS_CLIENT_ID/SECRET, the Access policy and the tunnel" >&2
          exit 1

      - name: Verify origin rejects requests without the service token
        # Only an Access denial counts. Express sets RateLimit-Policy on every /api response
        # (express-rate-limit standardHeaders), so that header means the backend was reached.
        # Access answers non-browser clients with a redirect to its login (302/303/307),
        # or 401 (managed OAuth) / 403.
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          if ! code="$(curl -sS -A "wdjjj-healthcheck/1.0" -D "$headers" -o /dev/null -w '%{http_code}' --max-redirs 0 https://origin.djjessejay.ch/api/health)"; then
            echo "origin.djjessejay.ch could not be reached; the probe proves nothing" >&2
            exit 1
          fi
          echo "Direct origin HTTP status without token: $code"
          if grep -qi '^ratelimit-policy:' "$headers"; then
            echo "The backend answered without the Access service token: origin is publicly reachable" >&2
            exit 1
          fi
          case "$code" in
            302|303|307)
              if grep -qiE '^location: *[^ ]*(/cdn-cgi/access/|cloudflareaccess\.com)' "$headers"; then exit 0; fi
              echo "Redirect does not point to Cloudflare Access" >&2; exit 1 ;;
            401|403) exit 0 ;;
            *) echo "Unexpected status $code: not an Access denial" >&2; exit 1 ;;
          esac
