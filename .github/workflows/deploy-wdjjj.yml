name: Deploy wdjjj

on:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/deploy-wdjjj.yml"
      - "scripts/cloudflare-deploy-preflight.mjs"
      - "test/cloudflare-deploy-preflight.test.mjs"
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 'Verify Cloudflare authentication and Worker read access without deploying'
        type: boolean
        default: false
      token_kind:
        description: 'Cloudflare API token kind (auto tries user then account verification)'
        type: choice
        options: [auto, user, account]
        default: auto

permissions:
  contents: read

env:
  # Cloudflare account ID is an identifier, not a credential (it already appears
  # in public Cloudflare bot comments on PRs). A CLOUDFLARE_ACCOUNT_ID repo secret,
  # if set, takes precedence.
  CLOUDFLARE_ACCOUNT_ID_PUBLIC: "2b0ff70ea2347c1e25d4c32c661d6356"

concurrency:
  group: deploy-wdjjj
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Test deployment preflight
        run: node --test test/cloudflare-deploy-preflight.test.mjs

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

      - name: Verify Cloudflare token and target Worker access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          CLOUDFLARE_TOKEN_KIND: ${{ inputs.token_kind || vars.CLOUDFLARE_TOKEN_KIND || 'auto' }}
          CF_WORKER_NAME: wdjjj
        run: node scripts/cloudflare-deploy-preflight.mjs

      - name: Record diagnostic-only completion
        if: inputs.diagnose_only == true
        run: echo 'Diagnostic-only run; no Worker upload or route change requested.' >> "$GITHUB_STEP_SUMMARY"

      # The 2026-10-17 run 39072704053 failed at Worker service authentication
      # (10000), before a successful upload or route change was recorded.
      # Earlier runs also failed to bind routes. These are distinct failure
      # stages: a missing x-proxy header alone does not establish route state.
      # The preflight above verifies token status and target read access only.
      # Deployment still needs edit access to wdjjj and Zone > Workers Routes
      # Write for affected route changes. See docs/CLOUDFLARE-DEPLOY-RECOVERY.md.
      - name: Deploy wdjjj
        if: inputs.diagnose_only != true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || env.CLOUDFLARE_ACCOUNT_ID_PUBLIC }}
          wranglerVersion: "4.145.0"
          workingDirectory: infra/cloudflare
          command: deploy

      - name: Verify Worker health
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsS -A "wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)" https://djjessejay.ch/__wdjjj/health)" && {
              echo "$body"
              echo "$body" | grep -q '"ok":true'
              echo "$body" | grep -q '"proxy":"wdjjj"'
              exit 0
            }
            sleep 10
          done
          echo "Cloudflare Worker health check failed" >&2
          exit 1

      - name: Verify apex
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -L --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' https://djjessejay.ch/)"
          echo "Apex HTTP status: $code"
          test "$code" = "200"

      - name: Verify security headers
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          headers="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -D - -o /dev/null https://djjessejay.ch/)"
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^referrer-policy:'

      - name: Verify POST rejection
        if: inputs.diagnose_only != true
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 5 --retry-delay 3 -o /dev/null -w '%{http_code}' -X POST https://djjessejay.ch/)"
          echo "POST HTTP status: $code"
          test "$code" = "405"
