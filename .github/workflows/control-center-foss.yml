name: Control Center FOSS

on:
  pull_request:
    paths:
      - 'control-center/foss/**'
      - '.github/workflows/control-center-foss.yml'
  push:
    branches: [main]
    paths:
      - 'control-center/foss/**'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jessejay_ci
          POSTGRES_USER: jessejay
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jessejay -d jessejay_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jessejay:ci-password@127.0.0.1:5432/jessejay_ci
    defaults:
      run:
        working-directory: control-center/foss/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Enforce Drizzle-only schema authority
        run: test ! -e ../db/schema.sql
      - run: npm run typecheck
      - run: npm run build
      - name: Apply checked-in Drizzle migrations
        run: npm run db:migrate

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose model
        working-directory: control-center/foss
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME/ci-only-placeholder/g' .env
          docker compose config --quiet
