name: Agent Security Boundary Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-security:
    name: AGENT-SEC-01..10
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AGENT-SEC-01..10 boundary gate
        shell: bash
        run: bash scripts/check-agent-security-boundary.sh
