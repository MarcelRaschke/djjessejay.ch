name: Agent Security Boundary Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-security:
    name: AGENT-SEC-01..10
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # releases/v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AGENT-SEC-01..10 boundary gate
        shell: bash
        run: bash scripts/check-agent-security-boundary.sh
