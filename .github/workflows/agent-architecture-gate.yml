name: Agent Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-boundary:
    name: MCP boundary, retry and reconnect
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Agent/MCP boundary gate
        shell: bash
        run: ./scripts/check-mcp-boundary.sh
