name: Live Site Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push-only smoke test cannot see an outage that starts between pushes, and
  # cannot see a recovery at all. The daily run closes both gaps.
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      force_live_checks:
        description: 'Run live-edge assertions even if the health endpoint is unreachable'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-worker:
    name: Validate Worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Worker syntax
        run: node --check infra/cloudflare/wdjjj.js

  smoke:
    name: Live edge smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The live edge is served by the wdjjj Cloudflare Worker, which is only
    # deployed from main. Pull requests cannot influence the live Worker, so
    # live-edge assertions only run on main pushes and manual dispatches.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # An unreachable edge used to skip every assertion below and report
      # success, so this workflow stayed green through the whole 2026-10 outage
      # (see DNS_CONFIG.md, "Live drift"). An outage must now either be fixed or
      # consciously acknowledged with an expiry date; it can no longer pass
      # unnoticed.
      #
      # To acknowledge a known outage, set the repository variable
      # LIVE_EDGE_OUTAGE_ACK_UNTIL to the UTC date the acknowledgement expires,
      # in YYYY-MM-DD form (Settings > Secrets and variables > Actions >
      # Variables). Up to and including that date the job warns and stays green;
      # from the following day it fails again, so a forgotten outage resurfaces
      # by itself. Delete the variable once the edge is restored.
      - name: Outage readiness gate
        id: readiness
        env:
          FORCE_LIVE_CHECKS: ${{ inputs.force_live_checks || 'false' }}
          OUTAGE_ACK_UNTIL: ${{ vars.LIVE_EDGE_OUTAGE_ACK_UNTIL }}
        run: |
          set -euo pipefail
          health_ua="wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)"
          health_url="https://djjessejay.ch/__wdjjj/health"
          today="$(date -u +%Y-%m-%d)"

          note() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if curl -fsS -m 15 -A "$health_ua" "$health_url" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Live edge reachable; running full live assertions."
            note "### Live edge: reachable"
            note ""
            note "Health endpoint answered. Full live assertions ran."
            exit 0
          fi

          # From here the edge is down.
          note "### Live edge: UNREACHABLE"
          note ""
          note "\`$health_url\` did not answer (checked $today UTC)."
          note ""
          note "A 522 at the apex with no \`x-proxy: wdjjj\` header means the"
          note "Worker never ran — look at the route binding, not the Worker code."
          note "See DNS_CONFIG.md, section \"Live drift\"."

          if [ "$FORCE_LIVE_CHECKS" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Live edge unreachable, but force_live_checks=true was requested. Running strict assertions; they are expected to fail."
            note ""
            note "\`force_live_checks=true\` was set, so strict assertions ran anyway."
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"

          if [ -z "${OUTAGE_ACK_UNTIL:-}" ]; then
            note ""
            note "No acknowledgement is set, so this run fails."
            note "Fix the edge, or set the repository variable"
            note "\`LIVE_EDGE_OUTAGE_ACK_UNTIL\` to a YYYY-MM-DD expiry date."
            echo "::error::Live edge unreachable and no outage acknowledgement is set. Restore the edge (see DNS_CONFIG.md, \"Live drift\"), or set the repository variable LIVE_EDGE_OUTAGE_ACK_UNTIL to a YYYY-MM-DD expiry date to accept the outage for a bounded period."
            exit 1
          fi

          if ! printf '%s' "$OUTAGE_ACK_UNTIL" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            note ""
            note "The acknowledgement value is malformed, so this run fails."
            echo "::error::LIVE_EDGE_OUTAGE_ACK_UNTIL must be a UTC date in YYYY-MM-DD form; got '$OUTAGE_ACK_UNTIL'."
            exit 1
          fi

          # ISO dates compare correctly as strings.
          if [ "$today" \> "$OUTAGE_ACK_UNTIL" ]; then
            note ""
            note "The acknowledgement expired on $OUTAGE_ACK_UNTIL, so this run fails."
            echo "::error::Live edge is still unreachable and the outage acknowledgement expired on $OUTAGE_ACK_UNTIL. Restore the edge (see DNS_CONFIG.md, \"Live drift\") or extend LIVE_EDGE_OUTAGE_ACK_UNTIL deliberately."
            exit 1
          fi

          note ""
          note "Acknowledged outage, accepted until **$OUTAGE_ACK_UNTIL** (UTC)."
          note "Live assertions were skipped. This run will start failing after that date."
          echo "::warning::Live edge unreachable. Accepted under LIVE_EDGE_OUTAGE_ACK_UNTIL=$OUTAGE_ACK_UNTIL; live assertions skipped. This gate fails automatically once that date passes."

      - name: Health endpoint
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          body="$(curl -fsS -A "wdjjj-healthcheck/1.0 (+https://github.com/MarcelRaschke/djjessejay.ch ci smoke test)" --retry 3 --retry-delay 2 https://djjessejay.ch/__wdjjj/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"proxy":"wdjjj"'

      - name: Apex returns a successful response
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -L --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' https://djjessejay.ch/)"
          test "$code" = "200"

      - name: WWW redirects to apex
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          location="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 3 --retry-delay 2 -D - -o /dev/null https://www.djjessejay.ch/ | awk 'tolower($1)=="location:" {print $2}' | tr -d '\r')"
          test "$location" = "https://djjessejay.ch/"

      - name: Mutating request on static path is rejected
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' -X POST https://djjessejay.ch/)"
          test "$code" = "405"

      - name: Disallowed method on API path is rejected
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          code="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 3 --retry-delay 2 -o /dev/null -w '%{http_code}' -X DELETE https://djjessejay.ch/api/health)"
          test "$code" = "405"

      - name: Security headers are present
        if: steps.readiness.outputs.ready == 'true'
        run: |
          set -euo pipefail
          headers="$(curl -sS -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" --retry 3 --retry-delay 2 -D - -o /dev/null https://djjessejay.ch/)"
          echo "$headers"
          echo "$headers" | grep -qi '^strict-transport-security:'
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^referrer-policy:'
