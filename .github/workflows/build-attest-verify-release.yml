name: Build Attest Verify Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. v7.1.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    outputs:
      artifact_path: ${{ steps.meta.outputs.artifact_path }}
      artifact_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Build immutable site bundle
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude=.git --exclude=dist -czf "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz" .
          echo "artifact_path=dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Compute SHA-256
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ steps.meta.outputs.artifact_path }}" | tee dist/SHA256SUMS
          digest="$(sha256sum "${{ steps.meta.outputs.artifact_path }}" | awk '{print $1}')"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: djjessejay.ch-${{ inputs.release_tag }}
          path: |
            ${{ steps.meta.outputs.artifact_path }}
            dist/SHA256SUMS
          if-no-files-found: error

  attest:
    name: Generate GitHub Artifact Attestation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: djjessejay.ch-${{ inputs.release_tag }}
          path: dist

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz"

  verify:
    name: Verify Provenance
    needs: attest
    runs-on: ubuntu-latest
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: djjessejay.ch-${{ inputs.release_tag }}
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Download attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation download \
            "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz" \
            --repo "${{ github.repository }}"

      - name: Verify GitHub Artifact Attestation with Cosign
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"
          bundle="sha256:${digest}.jsonl"
          test -s "$bundle"
          cosign verify-blob-attestation \
            --bundle "$bundle" \
            --new-bundle-format \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --certificate-identity="https://github.com/${{ github.repository }}/.github/workflows/build-attest-verify-release.yml@refs/heads/main" \
            "$artifact"

      - name: Verify artifact provenance with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz" \
            --repo "${{ github.repository }}" \
            --signer-repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-attest-verify-release.yml" \
            --source-ref refs/heads/main

      - name: Verify artifact digest
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz"

  release:
    name: Publish Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: djjessejay.ch-${{ inputs.release_tag }}
          path: dist

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ERROR: release already exists: ${{ inputs.release_tag }}" >&2
            exit 1
          fi
          gh release create "${{ inputs.release_tag }}" \
            --target main \
            --title "${{ inputs.release_tag }}" \
            --generate-notes \
            "dist/djjessejay.ch-${{ inputs.release_tag }}.tar.gz" \
            "dist/SHA256SUMS"

      - name: Release gate passed
        run: echo "RELEASE PROVENANCE: PASS"
