name: Origin Protection Verification
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify Scripts
        run: |
          [[ -f scripts/verify-origin-protection.js ]] || exit 1
          [[ -f scripts/cloudflare-tunnel-setup.js ]] || exit 1
      - name: Syntax Check
        run: |
          node --check scripts/verify-origin-protection.js
          node --check scripts/cloudflare-tunnel-setup.js
      - name: Deployment Checklist
        run: bash scripts/deployment-checklist.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PUBLIC_HOSTNAME: origin.djjessejay.ch
          # Service token ID (not the secret) as a repository variable.
          CF_ORIGIN_ACCESS_SERVICE_TOKEN_ID: ${{ vars.CF_ORIGIN_ACCESS_SERVICE_TOKEN_ID }}
