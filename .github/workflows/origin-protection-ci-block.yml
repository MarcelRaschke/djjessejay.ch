name: Origin Protection Verification
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Scripts
        run: |
          [[ -f scripts/verify-origin-protection.js ]] || exit 1
          [[ -f scripts/cloudflare-tunnel-setup.js ]] || exit 1
      - name: Syntax Check
        run: |
          node --check scripts/verify-origin-protection.js
          node --check scripts/cloudflare-tunnel-setup.js
      - name: Deployment Checklist
        run: bash scripts/deployment-checklist.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ORIGIN_HOST: ${{ secrets.ORIGIN_HOST }}
