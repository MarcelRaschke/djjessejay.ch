name: Provenance Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v7-release-provenance:
    name: Verify v7.0.0 Sigstore provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-release-attestation.sh
