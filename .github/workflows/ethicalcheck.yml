name: Ethical Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  vulnerability-scanning:
    name: Trivy Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

  ethical-check:
    name: Ethical Check
    runs-on: ubuntu-latest
    needs: vulnerability-scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ethical check
        run: |
          set -o pipefail && \
          ethicalcheck --run || true

      - name: Handle errors
        if: failure()
        run: |
          echo "An error occurred during the ethical check. Check the logs for details."

      - name: Upload Logs
        if: failure()
        run: |
          echo "Uploading logs..."
          # commands to upload logs
