name: Ethical Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  vulnerability-scanning:
    name: Trivy Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'

  ethical-check:
    name: Ethical Check
    runs-on: ubuntu-latest
    needs: vulnerability-scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Set up Python
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run ethical check
        run: |
          set -o pipefail && \
          ethicalcheck --run || true

      - name: Handle errors
        if: failure()
        run: |
          echo "An error occurred during the ethical check. Check the logs for details."

      - name: Upload Logs
        if: failure()
        run: |
          echo "Uploading logs..."
          # commands to upload logs
