<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Jesse Jay - Blue Dimension Hero Animation Test</title>
    <meta name="description" content="Cinematic 3D WebGL hero animation for DJ Jesse Jay">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            overflow: hidden;
            min-height: 100vh;
        }
        
        #app {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #hero-animation {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a 0%, #1e3c72 100%);
        }
        
        #hero-animation canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        
        .hero-title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 700;
            color: #00b7ff;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 183, 255, 0.5);
            margin-bottom: 1rem;
            animation: fadeInDown 1s ease-out;
        }
        
        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            color: #94a3b8;
            text-align: center;
            max-width: 600px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        
        .hero-frequency {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            animation: pulse 2s ease-in-out infinite;
            z-index: 20;
            pointer-events: none;
        }
        
        .hero-controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 20;
            pointer-events: auto;
        }
        
        .hero-controls button {
            padding: 0.75rem 1.5rem;
            border: 2px solid #00b7ff;
            background: rgba(0, 183, 255, 0.1);
            color: #00b7ff;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-family: inherit;
            font-size: 1rem;
        }
        
        .hero-controls button:hover {
            background: rgba(0, 183, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 183, 255, 0.3);
        }
        
        .hero-controls button:active {
            transform: translateY(0);
        }
        
        .hero-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 20;
        }
        
        .hero-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00b7ff, #00ffff, #00b7ff);
            width: 0%;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(0, 183, 255, 0.5);
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 3rem;
            height: 3rem;
            border: 4px solid rgba(0, 183, 255, 0.3);
            border-top-color: #00b7ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 1rem;
        }
        
        .info-panel {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(30, 60, 114, 0.8);
            padding: 1rem;
            border-radius: 0.5rem;
            max-width: 300px;
            z-index: 20;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        }
        
        .info-panel h3 {
            color: #00b7ff;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .info-panel p {
            color: #94a3b8;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        
        .phase-indicator {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            color: #00ffff;
            z-index: 20;
            pointer-events: none;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            }
            50% {
                opacity: 0.8;
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            }
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @media (max-width: 768px) {
            .hero-frequency {
                font-size: 1.2rem;
                top: 1rem;
                right: 1rem;
            }
            
            .hero-controls {
                bottom: 1rem;
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .hero-controls button {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
            
            .info-panel {
                display: none;
            }
            
            .phase-indicator {
                display: none;
            }
        }
    </style>
    
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
            <p class="loading-text">Loading Blue Dimension Experience...</p>
        </div>
        
        <!-- Hero Animation Container -->
        <div id="hero-animation"></div>
        
        <!-- Overlay Content -->
        <div class="hero-overlay">
            <h1 class="hero-title">DJ Jesse Jay</h1>
            <p class="hero-subtitle">The Blue Dimension - 97.5 MHz</p>
        </div>
        
        <!-- Frequency Display -->
        <div class="hero-frequency">97.5 MHz</div>
        
        <!-- Phase Indicator -->
        <div id="phase-indicator" class="phase-indicator">Phase: Loading...</div>
        
        <!-- Controls -->
        <div class="hero-controls">
            <button id="play-btn">Play Animation</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
        
        <!-- Progress Bar -->
        <div class="hero-progress">
            <div id="progress-bar" class="hero-progress-bar"></div>
        </div>
        
        <!-- Info Panel -->
        <div class="info-panel">
            <h3>Blue Dimension Animation</h3>
            <p>Cinematic 3D WebGL experience transforming 2D artwork into a live DJ performance.</p>
        </div>
    </div>
    
    <!-- Three.js and Animation Script -->
    <script type="module">
        import { BlueDimensionHeroAnimation } from './js/hero-animation.js';
        
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('hero-animation');
            const loadingOverlay = document.getElementById('loading-overlay');
            const phaseIndicator = document.getElementById('phase-indicator');
            const progressBar = document.getElementById('progress-bar');
            
            // Create animation
            const animation = new BlueDimensionHeroAnimation(container, {
                quality: 'high',
                targetFPS: 120
            });
            
            // Store reference
            window.animation = animation;
            
            // Hide loading overlay
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
            }, 2000);
            
            // Update phase indicator
            function updatePhaseIndicator() {
                const phase = animation.state.getCurrentPhase();
                const progress = animation.state.getPhaseProgress();
                const totalProgress = animation.state.getElapsedTime() / animation.options.timings.totalDuration;
                
                const phaseNames = [
                    'Static Artwork',
                    'Cyan LoRa Pulse',
                    'Subtle Animation',
                    'Palm Press',
                    'RF Membrane',
                    'Hand Emergence',
                    'Bass Drop',
                    'Equipment Pull',
                    'Needle Drop',
                    'Floor Spread',
                    'Performance',
                    'Broadcast Field'
                ];
                
                phaseIndicator.textContent = `Phase: ${phaseNames[phase] || 'Complete'} (${Math.round(progress * 100)}%)`;
                progressBar.style.width = `${Math.min(100, totalProgress * 100)}%`;
                
                requestAnimationFrame(updatePhaseIndicator);
            }
            
            updatePhaseIndicator();
            
            // Button controls
            document.getElementById('play-btn').addEventListener('click', () => {
                animation.play();
            });
            
            document.getElementById('pause-btn').addEventListener('click', () => {
                animation.pause();
            });
            
            document.getElementById('reset-btn').addEventListener('click', () => {
                animation.reset();
            });
            
            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (animation.state.isPaused) {
                        animation.resume();
                    } else {
                        animation.pause();
                    }
                } else if (e.code === 'KeyR') {
                    animation.reset();
                }
            });
        });
    </script>
    
    <!-- Fallback for browsers without ES modules -->
    <script nomodule>
        document.getElementById('loading-overlay').innerHTML = `
            <div style="text-align: center; color: #ff4444;">
                <h2>Browser Not Supported</h2>
                <p>Your browser does not support ES Modules, which are required for this experience.</p>
                <p>Please use a modern browser like Chrome, Firefox, Edge, or Safari.</p>
            </div>
        `;
    </script>
</body>
</html>
