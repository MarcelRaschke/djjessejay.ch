<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJ Jesse Jay Control Center</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="/control-center/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRIVATE CONTROL PLANE</p>
        <h1>DJ JESSE JAY <span>CONTROL CENTER</span></h1>
      </div>
      <div class="signal">BLUE DIMENSION · 97.5</div>
    </header>

    <nav class="nav" aria-label="Control Center">
      <button data-view="overview" class="active">Overview</button>
      <button data-view="cms">Website / CMS</button>
      <button data-view="music">Music & Discography</button>
      <button data-view="radio">Blue Dimension / Radio</button>
      <button data-view="events">Events</button>
      <button data-view="visuals">Visuals</button>
      <button data-view="analytics">Analytics</button>
      <button data-view="audit">Settings / Audit</button>
    </nav>

    <section id="content" class="content" aria-live="polite"></section>
  </main>
  <script src="/control-center/app.js" defer></script>
</body>
</html>
