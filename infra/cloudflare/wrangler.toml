# wdjjj — Cloudflare Worker Reverse-Proxy für djjessejay.ch
# Canonical GitHub Pages project site for this repository.
name = "wdjjj"
main = "wdjjj.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "djjessejay.ch/*",     zone_name = "djjessejay.ch" },
  { pattern = "www.djjessejay.ch/*", zone_name = "djjessejay.ch" }
]

[observability]
enabled = true

[vars]
ORIGIN_HOST = "marcelraschke.github.io"
ORIGIN_PREFIX = "/djjessejay.ch"
# API_ORIGIN_HOST is intentionally NOT declared here. It is a Wrangler secret
# (`wrangler secret put API_ORIGIN_HOST`), holding the Express origin hostname
# (e.g. origin.djjessejay.ch). Declaring it in [vars] makes every deploy
# overwrite the secret. Unset -> /api/* returns 502 (see wdjjj.js).
API_ORIGIN_SCHEME = "https"
