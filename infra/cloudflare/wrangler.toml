# wdjjj — Cloudflare Worker Reverse-Proxy für djjessejay.ch
# Canonical GitHub Pages project site for this repository.
name = "wdjjj"
main = "wdjjj.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "djjessejay.ch/*",     zone_name = "djjessejay.ch" },
  { pattern = "www.djjessejay.ch/*", zone_name = "djjessejay.ch" }
]

[observability]
enabled = true

[vars]
ORIGIN_HOST = "marcelraschke.github.io"
ORIGIN_PREFIX = "/djjessejay.ch"
# API backend origin for /api/* routing. API_ORIGIN_HOST is deliberately NOT
# declared here, and it must be stored as a SECRET — not as a plain Variable.
#
# Why the distinction decides whether /api/* works:
#
#   `wrangler deploy` deletes every plain-text var on the Worker before it
#   applies the [vars] below. A value set as a Variable in the dashboard is
#   therefore erased by the next deploy whether or not this file mentions it.
#   Secrets are never deleted by a deployment.
#   https://developers.cloudflare.com/workers/wrangler/configuration/
#   ("Wrangler will not delete your secrets ... unless you run
#   `wrangler secret delete <key>`")
#
# That is what happened. deploy-wdjjj run 38246122897 (re-run 2026-10-14)
# logged wrangler erasing the value, which only a Variable can suffer:
#
#   -    API_ORIGIN_HOST: "djjessejay.ch"
#   +    API_ORIGIN_HOST: ""
#
# Empty, the Worker short-circuits every /api/* request to HTTP 502
# "API origin not configured" (see wdjjj.js) — the live state on 2026-10-24.
#
# Do NOT restore the erased value. `djjessejay.ch` is the apex, which
# ORIGIN-PROTECTION-DEPLOYMENT.md rules out explicitly ("Never use the apex
# or `www`"). The documented value is the tunnel hostname:
#
#   npx wrangler secret put API_ORIGIN_HOST     # origin.djjessejay.ch
#
# Prerequisites, per ORIGIN-PROTECTION-DEPLOYMENT.md. The ORDER MATTERS and
# is the opposite of what reads naturally — the tunnel comes LAST:
#
#   1. Create the Access service token in Zero Trust > Access > Service Auth.
#   2. Set ORIGIN_ACCESS_CLIENT_ID and ORIGIN_ACCESS_CLIENT_SECRET as Worker
#      secrets.
#   3. Make the Worker FORWARD those two secrets as the cf-access-client-id /
#      cf-access-client-secret headers on its /api subrequests, and deploy it.
#   4. Run `scripts/cloudflare-tunnel-setup.js --apply`.
#   5. Install and run `cloudflared` on the origin host with the tunnel token.
#      --apply deliberately does not print that token and does not start a
#      connector, so a fresh tunnel resolves in DNS while the backend stays
#      unreachable until this step is done (ORIGIN-PROTECTION-DEPLOYMENT.md,
#      "The script intentionally does not print the tunnel token").
#
# Why the tunnel comes after step 3: one --apply run creates the tunnel, the
# Access app, ITS SERVICE-TOKEN-ONLY POLICY and the DNS record together (see
# the mutate phase of that script). The moment origin.djjessejay.ch resolves,
# it is already closed to anything that does not present the token. Run it
# before step 3 and EVERY /api request fails at Access — turning today's
# honest 502 ("API origin not configured") into a 403 that looks like a
# credentials problem rather than a missing code path.
#
# Step 3 is now IN THE REPOSITORY. proxyToApiOrigin() strips any inbound
# cf-access-* header and sets cf-access-client-id / cf-access-client-secret
# from the two secrets; test/wdjjj-api-auth.test.mjs covers it. The code was
# ported from PR #160 (head a21bb520), which carried it on a branch that was
# closed without merging.
#
# It is in the repository, which is not the same as in the running Worker.
# wrangler deploy has to succeed for that, and deploy-wdjjj has failed on
# every run since 2026-10-22 because the CLOUDFLARE_API_TOKEN repo secret is
# expired (the preflight reports tokenStatus: "expired").
#
# The forwarding FAILS CLOSED. Without ORIGIN_ACCESS_CLIENT_ID and
# ORIGIN_ACCESS_CLIENT_SECRET the Worker answers /api/* with 502
# "API origin credentials not configured" instead of sending an
# unauthenticated subrequest. So once this deploys, both secrets must exist
# or /api/* changes from Access's 403 to that 502. It also refuses any scheme
# other than https and any host other than origin.<zone>, so a mistyped
# API_ORIGIN_HOST cannot leak the token elsewhere.
#
# API_ORIGIN_HOST itself can be set at any point; it takes effect once
# origin.djjessejay.ch resolves, which is step 4.
#
# `keep_vars = true` would also stop the erasure, but it suppresses it for
# every var and lets dashboard state drift away from this file. Prefer the
# secret.
API_ORIGIN_SCHEME = "https"
