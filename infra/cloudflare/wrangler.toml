# wdjjj — Cloudflare Worker Reverse-Proxy für djjessejay.ch
# Canonical GitHub Pages project site for this repository.
name = "wdjjj"
main = "wdjjj.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "djjessejay.ch/*",     zone_name = "djjessejay.ch" },
  { pattern = "www.djjessejay.ch/*", zone_name = "djjessejay.ch" }
]

[observability]
enabled = true

[vars]
ORIGIN_HOST = "marcelraschke.github.io"
ORIGIN_PREFIX = "/djjessejay.ch"
# API backend origin for /api/* routing. API_ORIGIN_HOST is managed as a
# Cloudflare remote secret (set via `wrangler secret put API_ORIGIN_HOST` or
# the dashboard) and is deliberately NOT declared here. A local [vars] entry
# with the same name replaces the remote secret on every deploy (Wrangler
# warning observed in deploy-wdjjj run 38246122897, 2026-10-12) and would
# silently disable /api/* routing at the live edge.
API_ORIGIN_SCHEME = "https"
