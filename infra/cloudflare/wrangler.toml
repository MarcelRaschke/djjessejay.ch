# wdjjj — Cloudflare Worker Reverse-Proxy für djjessejay.ch
# Canonical GitHub Pages project site for this repository.
name = "wdjjj"
main = "wdjjj.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "djjessejay.ch/*",     zone_name = "djjessejay.ch" },
  { pattern = "www.djjessejay.ch/*", zone_name = "djjessejay.ch" }
]

[observability]
enabled = true

[vars]
ORIGIN_HOST = "marcelraschke.github.io"
ORIGIN_PREFIX = "/djjessejay.ch"
# API backend origin for /api/* routing. Set API_ORIGIN_HOST to the Express
# server host (e.g. origin.djjessejay.ch) via Wrangler secret or dashboard.
# Leave empty to disable API routing (returns 502 for /api/*).
API_ORIGIN_HOST = ""
API_ORIGIN_SCHEME = "https"
